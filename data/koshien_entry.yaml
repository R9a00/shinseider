entry_sections:
- id: genba
  title: 現業と自分
  question: いまの家業は何をしている会社で、あなたはどう関わっていますか？
  hint: 会社の事業・規模感・あなたの立場や担当。数字（年商・人数・年数）があると伝わります
  elements:
  - 会社の事業と主力製品・サービス（一言で）
  - 規模の数字（年商・従業員数・創業年数のいずれか）
  - 自分の立場・担当と関わった年数
  - 承継の予定・時期（未定でも可）
- id: kadai
  title: 現場で感じている課題
  question: 現場にいて「このままではまずい」と感じていることは何ですか？
  hint: 実際にあった出来事や数字で。あなたにしか見えていない現場の実感が一番の材料です
  elements:
  - 実際にあった出来事（いつ・何が起きたか）
  - 課題の大きさを示す数字（例:求人応募ゼロ、原価率）
  - 顧客が困っている具体的な場面
  - 背景にある業界・地域・社会の変化
- id: shinkijigyo
  title: やりたい新規事業
  question: 何を新しく始めたいですか？誰の、どんな困りごとを解決しますか？
  hint: 「誰の」が具体的なほど強くなります
  elements:
  - 一言で言うと何か（20字程度）
  - 誰に売るか（既存顧客・新規法人・消費者・海外・地域。具体的に）
  - 何を・どうやって提供するか
  - どう稼ぐか（売り切り/継続課金/手数料などの形、単価×数量の目安）
  - 検証状況（アイデア/試作/テスト販売/販売中）と顧客の声
- id: keieishigen
  title: 家業の経営資源の活用
  question: 家業の何（技術・設備・顧客・信用・人）を使って、それを実現しますか？
  hint: 応募資格にも関わる大事な点です。ゼロからの起業との違いがここに出ます
  elements:
  - 使う資源はどれか（技術・設備・顧客・信用・人・データ）
  - その資源が新規事業でどう効くか（ゼロからの起業との違い）
  - 競合や他社との違い
  - 足りないもの（技術・体制・許認可・調達）とその埋め方
- id: mirai
  title: 実現したい未来
  question: それができたら、会社と地域はどう変わりますか？
  hint: 大会テーマは「実現したい未来を語れ」。あなた自身がどうなっていたいかも
  elements:
  - なぜ自分がやるのか（きっかけになった経験）
  - 承継で何を守り、何を変えるか
  - 実現したら会社・地域・業界はどう変わるか
  - 最初のマイルストーン（年月と内容）と想定リスクへの構え
elements_provenance: 旧シンセイダー（backend/subsidies_with_forms.yaml アトツギ甲子園 53マイクロタスク）から、ピッチの中身に関わる要素を5テーマに蒸留（2026-08-12）。氏名・所在地等の事務項目は除外
validation:
  min_chars: 80
  want_numbers: true
checklist:
- 公式サイトのエントリーフォームの項目をひととおり確認した
- エントリー文を声に出して読んでみた
- 現経営者（親）に内容を話した ※申請は会社名・事業者名で行うため
- 送信は締切前日（11/24）までに行う予定を決めた
- エントリー後に届くフォーマットへの転記と、PDF提出（11/27 12:00）を予定に入れた
- 数字が3つ以上入っている（現状の規模・課題の大きさ・効果の見込みのどれか）
- 「革新的」「画期的」のような形容だけの言葉を、根拠なしに使っていない
- 応募資格（39歳以下・後継予定・家業の経営資源の活用）に自分が当てはまる根拠が本文から読み取れる
prompt_template: |
  あなたはインタビュアーです。私はアトツギ（中小企業の後継予定者）。ピッチ大会「アトツギ甲子園」のエントリー文の材料を、質問して引き出してください。

  進め方:
  - 5テーマを順に、質問は一度に1つ、各テーマ3〜4往復。
  - 未回答の要素だけを短く聞く。埋まったものは聞き直さない。
  - 抽象的な答えには、出来事・固有名詞・数字を1つ引き出す追い質問を。
  - 「わからない」には仮の書き方を提案して先へ。尋問にしない。
  - 効果・未来の話は「誰に・どれくらい」を数字で1つ（無ければ仮置き）。

  テーマと要素:
  {theme_elements}

  終わったら私の言葉を活かして清書。見出しは一字一句:
  ## 現業と自分
  ## 現場で感じている課題
  ## やりたい新規事業
  ## 家業の経営資源の活用
  ## 実現したい未来

  各250〜400字。数字と固有名詞を残し、話していない内容は足さない。誇張しない。では最初の質問から。
pace:
  submit_target: '2026-11-24'
  buckets:
  - min_days: 90
    message: まだ十分間に合います。急ぎませんが、現経営者との対話だけは、早く始めるほど楽になります。
  - min_days: 45
    message: 間に合います。今月中にエントリー文の骨子まで進めておくと、後半に余裕ができます。
  - min_days: 21
    message: まだ間に合います。エントリー文はAIとのインタビューで1〜2日あれば形になります。今週始めれば余裕があります。
  - min_days: 7
    message: 今からでも間に合います。今日インタビューを始めれば、数日で骨子→読み合わせ→送信までいけます。
  - min_days: 1
    message: ぎりぎりですが、間に合います。今日中に骨子を作り、明日読み合わせて送信する日程です。
  - min_days: 0
    message: 本日が締切です。18:00までに公式サイトから送信を。
  # エントリー締切(11/25 18:00)後〜書類提出締切(11/27 12:00)の間に出す文言
  closed_message_docs: 第7回のエントリー受付は終了しました。エントリー済みの方は、応募書類の提出を11/27 12:00までに。
  # 書類提出締切も過ぎた後に出す文言
  closed_message: 第7回の受付は終了しました。次の機会に向けた情報も引き続き掲載します。
  # 30秒チェックの結果画面用の短いペース表現（間に合うかページのbucketsとは別）
  check_buckets:
  - min_days: 21
    message: まだかなり猶予があります。
  - min_days: 8
    message: まだ十分間に合います。
  - min_days: 0
    message: まだ間に合います。
ai_targets:
# mode: prefill = ?q= で指示文入りのまま開ける（Claude/ChatGPTが対応）
#       copy_open = URLで本文を渡せないAI。コピーして開き、貼り付けてもらう
- id: claude
  name: Claude
  mode: prefill
  url: https://claude.ai/new?q={prompt}
  q_base: https://claude.ai/new?q=
  favicon_domain: claude.ai
  home_url: https://claude.ai/new
  note: 指示文が入った状態で開きます
- id: chatgpt
  name: ChatGPT
  mode: prefill
  url: https://chatgpt.com/?q={prompt}
  q_base: https://chatgpt.com/?q=
  favicon_domain: chatgpt.com
  home_url: https://chatgpt.com/
  note: 指示文が入った状態で開きます
- id: gemini
  name: Gemini
  mode: copy_open
  url: https://gemini.google.com/app
  favicon_domain: gemini.google.com
  home_url: https://gemini.google.com/app
  note: コピーされます — 開いたら貼り付け
- id: grok
  name: Grok
