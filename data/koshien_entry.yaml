  url: https://grok.com/
  favicon_domain: grok.com
  home_url: https://grok.com/
  note: コピーされます — 開いたら貼り付け
review_prompt_template: |
  あなたは中小企業の新規事業ピッチ大会の審査委員です。以下は、後継予定者（アトツギ）が書いたエントリー文の骨子です。
  あなたは本人の関係者ではありません。忖度は不要です。励ましだけの感想は書かないでください。

  審査の観点（この5つで骨子を見てください）:
  - 承継の物語 — 誰から誰へ、何を引き継ぎ、何を守り、何を変えるのかが書かれているか
  - 実現性 — 体制・経営資源・計画が噛み合っているか。リスクへの構えがあるか
  - 独自性 — 他社との違いと、真似されにくい理由があるか
  - 事業価値 — どう稼ぐかの筋が通っているか。数字に無理がないか
  - 波及 — 顧客や地域の課題とつながっているか。効果が数字で語られているか

  次の形式で、具体的に指摘してください。
  1. 伝わってきた強み（2点。本文のどこからそう読めたか、引用付きで）
  2. 伝わらなかった・弱いところ（3点。上の観点のどれが欠けているかを添えて）
  3. いちばん危ういところ（この構想が崩れるとしたら、どこからか。1点）
  4. 直すなら最初の一手（明日できる具体的なことを1つ）

  点数は付けないでください。指摘は人格ではなく構想に限ってください。

  ---

  {draft}

sample_entry:
  note: 架空の会社の例です。長さと具体さの目安にしてください。
  sections:
  - title: 現業と自分
    body: 祖父が1974年に興した金属加工の会社で、製造を見ています。港湾設備の補修部品から始まり、いまは産業機械向けの単品加工が中心。従業員18名、年商2.4億円。私は入社8年目で、2011年に父が導入したCAD/CAMの運用を任されてきました。承継は3年後の予定です。
  - title: 現場で感じている課題
    body: 昨年、長年の取引先だった試作専門の同業が廃業しました。地域で単品・小ロットを頼める先が減り、見積もりを取ると納期は7〜10日。試作で待たされた開発案件が流れるのを、何度も見ています。
  - title: やりたい新規事業
    body: 単品部品のオンライン受注です。設計データを送ると自動で見積もりが返り、最短3日で部品が届く。相手は、開発部門やスタートアップの試作担当者。「試作の待ち時間」を、売り物になる速さに変えます。
  - title: 家業の経営資源の活用
    body: 過去10年の加工実績から見積もりを関数化してあり、誤差は±20%から実用水準まで詰めました。5軸加工機と、平均3.2日で回す段取りのノウハウ。ゼロからの起業では、この見積精度と納期は出せません。足りないのは受注側の仕組みで、そこが今回の挑戦です。
  - title: 実現したい未来
    body: 「試作で待たされない地域」を作りたい。2027年春に受注サイトを正式公開し、初年度は月30件が目標。速さで開発を支える町工場として、若手が入りたくなる会社に変えていきます。
