review_prompt_template: |
  あなたは中小企業の新規事業ピッチ大会の審査委員です。以下は、後継予定者（アトツギ）が書いたエントリー文の骨子です。
  あなたは本人の関係者ではありません。忖度は不要です。励ましだけの感想は書かないでください。

  これは非公式のAI予行審査です。公式の審査や通過の保証ではありません。
  公式5評価を参照します（以下の確認問いはツール独自の補助です）:
  {official_review_axes}
  本人が実行済みの行動と将来計画を区別してください。5テーマは材料整理で、公式6記載項目そのものではありません。

  次の形式で、具体的に指摘してください。
  1. 伝わってきた強み（2点。本文のどこからそう読めたか、引用付きで）
  2. 伝わらなかった・弱いところ（3点。上の観点のどれが欠けているかを添えて）
  3. いちばん危ういところ（この構想が崩れるとしたら、どこからか。1点）
  4. 直すなら最初の一手（明日できる具体的なことを1つ）

  点数は付けないでください。指摘は人格ではなく構想に限ってください。

  ---

  {draft}

# 締切が近いときに効く、公式の決まり（道筋ページに掲載）。
# すべて公式サイト・公式要項の記載の要約。独自の助言を混ぜるときは「本ツールの」と明記すること。
# 人数など日々変わる値は as_of を必ず本文に入れる。
late_start:
  checked: '2026-11-12'
  note: 公式サイトと公式の応募書類要項の記載を要約したものです。原文と、エントリー後に事務局から届く案内が常に優先します。
  owner_flyer:
    label: 現経営者に見せられる、公式の紹介チラシ（先代向け・PDF）
    url: https://atotsugi-koshien.go.jp/slp/wpist/wp-content/themes/atotsugi202507/assets/pdf/atotsugi_chirashi_02.pdf
  facts:
  - title: 応募書類は出し直せる
    text: 受付期間内（11/27 12:00まで）であれば、応募書類の出し直しができます。仕上がりを待たずに一度提出し、時間が残れば差し替える進め方がとれます。
    source_label: 公式「エントリー・推薦の流れ」
    source_url: https://atotsugi-koshien.go.jp/entry_flow
  - title: サンプルフォーマットはエントリーの後に届く
    text: 応募書類のサンプルフォーマットと今後の案内は、エントリーの後に事務局から届きます。届くまでの時間は公式に明記がありません。エントリー後は自動返信メールが届いているかを確認し、届いていなければ事務局へ連絡します。
    source_label: 公式「エントリー・推薦の流れ」「開催概要」
    source_url: https://atotsugi-koshien.go.jp/entry_flow
  - title: デザインは審査基準ではない
    text: 書類のデザイン性は審査基準ではありません。サンプルフォーマットの使用は任意で、ページ数とページごとの記載項目を守れば独自の様式でも応募できます。一方で公式要項は、写真・グラフ・図解など伝わりやすい表現を勧めています。
    source_label: 公式「応募書類要項」（2026年9月改定）
    source_url: https://atotsugi-koshien.go.jp/slp/wpist/wp-content/themes/atotsugi202507/assets/pdf/application_form_requirements.pdf
  - title: 提出はPDFをメールで
    text: PowerPointで作った書類をPDFに変換し、メールで提出します。表紙を含めて8ページ（本文7ページ）です。送付先は公式の応募書類要項と、エントリー後に届く案内で確認してください。
    source_label: 公式「応募書類要項」（2026年9月改定）
    source_url: https://atotsugi-koshien.go.jp/slp/wpist/wp-content/themes/atotsugi202507/assets/pdf/application_form_requirements.pdf
  - title: エントリーすると会社名が公式サイトに載る
    text: エントリーすると、公式サイトの特設ページに事業プラン名と会社名などが掲載されます。登録の前に、現経営者へ伝えておきます。
    source_label: 公式「応募書類要項」（2026年9月改定）
    source_url: https://atotsugi-koshien.go.jp/slp/wpist/wp-content/themes/atotsugi202507/assets/pdf/application_form_requirements.pdf
  - title: エントリー後にプロフィール写真を送る
    text: エントリー後に事務局から届く案内メールの到着から10日以内に、応募に関する回答とプロフィール写真を送ります。写真は高精度で未編集のものが条件です。先に用意しておけます。
    source_label: 公式「エントリー・推薦の流れ」
    source_url: https://atotsugi-koshien.go.jp/entry_flow
  - title: 先に会員登録が要る
    text: エントリーフォームへ進むには会員登録が必要です。昨年度に会員登録をした方は新規登録が不要で、登録済みのIDでログインします。
    source_label: 公式 新規会員登録
    source_url: https://form.atotsugi-koshien.go.jp/register
  - title: 地方大会に進むのは各ブロック15人
    text: 書類審査で、6つの地方ブロックごとに15人が地方大会へ進みます。エントリー者数は176人です（2026年11月9日現在）。最新の人数は公式の一覧で確認できます。
    source_label: 公式「応募書類要項」「第7回エントリー者一覧」
    source_url: https://atotsugi-koshien.go.jp/entrant
  - title: 推薦によるエントリーは11/20 12:00まで
    text: 周囲の方の推薦によるエントリーは、推薦の締切が11月20日（金）12:00です。後継予定者本人によるエントリーの締切（11/25 18:00）とは別です。
    source_label: 公式「エントリー・推薦の流れ」
    source_url: https://atotsugi-koshien.go.jp/entry_flow

sample_entry:
  note: 架空の会社の例です。長さと具体さの目安にしてください。
  sections:
  - title: 現業と自分
    body: 祖父が1974年に興した金属加工の会社で、製造を見ています。港湾設備の補修部品から始まり、いまは産業機械向けの単品加工が中心。従業員18名、年商2.4億円。私は入社8年目で、2011年に父が導入したCAD/CAMの運用を任されてきました。承継は3年後の予定です。
  - title: 現場で感じている課題
    body: 昨年、長年の取引先だった試作専門の同業が廃業しました。地域で単品・小ロットを頼める先が減り、見積もりを取ると納期は7〜10日。試作で待たされた開発案件が流れるのを、何度も見ています。
  - title: やりたい新規事業
    body: 単品部品のオンライン受注です。設計データを送ると自動で見積もりが返り、最短3日で部品が届く。相手は、開発部門やスタートアップの試作担当者。「試作の待ち時間」を、売り物になる速さに変えます。
  - title: 家業の経営資源の活用
    body: 過去10年の加工実績から見積もりを関数化してあり、誤差は±20%から実用水準まで詰めました。5軸加工機と、平均3.2日で回す段取りのノウハウ。ゼロからの起業では、この見積精度と納期は出せません。足りないのは受注側の仕組みで、そこが今回の挑戦です。
  - title: 実現したい未来
    body: 「試作で待たされない地域」を作りたい。2027年春に受注サイトを正式公開し、初年度は月30件が目標。速さで開発を支える町工場として、若手が入りたくなる会社に変えていきます。

# 締切が近いときの指示文。公式6項目を直接聞き、応募書類の文面まで出す。
# URLに入れて渡すため短く保つこと（ビルドが上限を検査する）。ページの割付は創作させない。
sprint_prompt_template: |
  あなたは編集者兼インタビュアーです。私は中小企業の後継予定者で、ピッチ大会「アトツギ甲子園」の応募書類（表紙＋本文7ページ）を短い時間で作ります。

  進め方:
  - 最初に、応募書類のサンプルフォーマットが手元にあるか聞く。あれば貼り付けを受けて割付に従う。無ければ下の6項目の順で進め、割付は創作しない。
  - 質問は一度に1つ。6項目を順に各2〜3往復。出来事・固有名詞・数字を引き出す。
  - 「わからない」は宿題に残して先へ。話していない実績や数字は足さない。未確認の数字は（仮）。
  - 実行済みの行動と将来の計画を分ける。

  公式6項目:
  {official_items}

  終わったら出力:
  1. 表紙案（事業プラン名を3案）
  2. 項目ごとに、伝える一文／本文（箇条書き3〜5）／数字と根拠／図・写真の候補
  3. 宿題（未確認・不足）
  4. 公式5評価（{official_axes}）から見て弱い点を3つ

  非公式の準備支援で、審査通過は保証しません。では最初の質問から。

# 公式要項と、このツール独自の材料整理の橋渡し。UI / MCP 共通の正本。
official_preparation:
  source_url: https://atotsugi-koshien.go.jp/slp/wpist/wp-content/themes/atotsugi202507/assets/pdf/application_form_requirements.pdf
  checked: '2026-11-12'
  distinction: このサイトの5テーマは応募書類の材料整理です。公式の6記載項目・5評価項目とは別です。字数・数字の個数・機械チェックは独自の目安で、応募要件や審査通過を示しません。
  format: PowerPointで本文7ページ＋表紙1ページ、合計8ページを作成しPDFで提出します。スライドサイズは16:9・4:3・A4横のいずれかです。サンプルの使用は任意ですが、指定のページ数とページごとの記載項目は守ります。6項目を1項目1ページと決めつけず、登録後に届くフォーマット・案内で割付を確認してください。動画・音源・アニメーションは使用しません。書類のデザイン性は審査基準ではありませんが、公式要項は写真・グラフ・図解など伝わりやすい表現を勧めています。
  workflow:
  - 現経営者に伝えたうえで、公式サイトで2026年11月25日18:00（日本時間）までにエントリー登録する。登録すると会社名と事業プラン名が公式サイトに掲載される。材料の完成を待たずに登録してよい。本ツールは連休前の11月19日までの登録を推奨するが、公式締切ではない。
  - 5テーマで材料を整理し、控えを保存する。未確認の数字は仮置きと明記する。
  - 届いたフォーマット・案内を確認し、下の対応表を参考に公式6項目へ材料を再構成する。不足は追加取材・調査し、本人の実行済みの行動と将来計画を分ける。
  - 公式5評価を参照して見直し、表紙・指定ページ数・各ページの記載項目・数値の根拠を確認する。
  - PDFにして2026年11月27日12:00（日本時間）までにメールで書類提出する。送付先は公式要項と登録後の案内で確認する。受付期間内は出し直せる。登録だけでは書類提出は完了しない。
  items:
  - title: 自分らしさ（アトツギとしての歩み）
    brief: なぜ継ぐのか・これまでの歩み・悩み
    material: 現業と自分／実現したい未来。自分の経験、承継への思い、実際に起こした行動をまとめる。
    axes: [持続可能性, 熱量・ストーリー]
  - title: 既存の経営資源（家業等）
    brief: 家業の紹介・創業者や先代の想い・強み・課題
    material: 現業と自分／家業の経営資源の活用。フカボリのルーツ・理念・強みも使い、何をどう活用するかを示す。
    axes: [持続可能性, 承継予定の会社の経営資源活用]
  - title: 時代・市場のトレンド
    brief: 注目した変化・きっかけ・今後の見通し
    material: 現場で感じている課題。PEST・競争構造で補い、変化の根拠・出典・自社への影響、なぜ注目したか、今後の見通しとその理由を整理する。
    axes: [新規性, 社会性]
  - title: 新規事業アイデア
    brief: 概要・込めた想い・実現したい未来・起こした行動
    material: やりたい新規事業／実現したい未来。誰の何を解決するか、独自性、資源の活用、本人の行動を具体化する。
    axes: [新規性, 持続可能性, 社会性, 承継予定の会社の経営資源活用, 熱量・ストーリー]
  - title: ビジネスモデル
    brief: 収益の上げ方・競合に対する優位性
    material: やりたい新規事業の収益の話。フカボリの収益モデル・競合・予算も使い、顧客、提供価値、価格、費用、継続性を整理する。
    axes: [持続可能性]
  - title: 詳細情報
    brief: 誰のどんな課題か・提供価値・市場規模
    material: 上の説明を補う材料。顧客・提供価値・市場規模等は例であり指定の必須内訳ではありません。検証、体制、計画など必要な情報を加える。
    axes: [新規性, 持続可能性, 社会性, 承継予定の会社の経営資源活用, 熱量・ストーリー]
  review_axes:
  - title: 新規性
    question: 新しさや競合との違いが、本文の根拠とともに伝わるか。
  - title: 持続可能性
    question: 顧客・収益・費用・体制・計画がつながり、中長期の収益・成長・継続の見通しがあるか。
  - title: 社会性
    question: 社会や地域の課題解決、または社会的意義が伝わるか。
  - title: 承継予定の会社の経営資源活用
    question: 家業等の資源を何にどう活用するかが具体的か。
  - title: 熱量・ストーリー
    question: 本人の歩み・思いに加え、実際に起こした行動が読み取れるか。将来計画と混同していないか。
