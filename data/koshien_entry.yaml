entry_sections:
- id: genba
  title: 現業と自分
  question: いまの家業は何をしている会社で、あなたはどう関わっていますか？
  hint: 会社の事業・規模感・あなたの立場や担当。数字（年商・人数・年数）があると伝わります
  elements:
  - 会社の事業と主力製品・サービス（一言で）
  - 規模の数字（年商・従業員数・創業年数のどれか1つ以上）
  - 自分の立場・担当と、関わってきた年数
  - 承継の予定・時期（未定なら未定のままでよい）
- id: kadai
  title: 現場で感じている課題
  question: 現場にいて「このままではまずい」と感じていることは何ですか？
  hint: 実際にあった出来事や数字で。あなたにしか見えていない現場の実感が一番の材料です
  elements:
  - 実際にあった出来事（いつ・何が起きたか）
  - 課題の大きさを示す数字（例：求人応募ゼロ、職人の平均年齢、原価率）
  - 顧客が困っている具体的な場面
  - 背景にある業界・地域・社会の変化
- id: shinkijigyo
  title: やりたい新規事業
  question: 何を新しく始めたいですか？誰の、どんな困りごとを解決しますか？
  hint: 「誰の」が具体的なほど強くなります
  elements:
  - 一言で言うと何か（20字程度）
  - 誰に売るか（既存顧客・新規の法人・消費者・海外・地域。できるだけ具体的に）
  - 何を・どうやって提供するか
  - どう稼ぐか（売り切り・継続課金・手数料などの形と、単価×数量の目安）
  - いまの検証状況（アイデア・試作・テスト販売・販売中）と、あれば顧客の声
- id: keieishigen
  title: 家業の経営資源の活用
  question: 家業の何（技術・設備・顧客・信用・人）を使って、それを実現しますか？
  hint: 応募資格にも関わる大事な点です。ゼロからの起業との違いがここに出ます
  elements:
  - 使う資源はどれか（技術・設備・顧客・信用・人・データ）
  - その資源が新規事業でどう効くか（ゼロからの起業との違い）
  - 競合や他社との違い
  - 足りないもの（技術の準備・体制・許認可・調達）と、その埋め方
- id: mirai
  title: 実現したい未来
  question: それができたら、会社と地域はどう変わりますか？
  hint: 大会テーマは「実現したい未来を語れ」。あなた自身がどうなっていたいかも
  elements:
  - なぜ自分がやるのか（きっかけになった経験）
  - 承継で何を守り、何を変えるか
  - 実現したら会社・地域・業界はどう変わるか
  - 最初のマイルストーン（年月と内容）と、想定するリスクへの構え
elements_provenance: 旧シンセイダー（backend/subsidies_with_forms.yaml アトツギ甲子園 53マイクロタスク）から、ピッチの中身に関わる要素を5テーマに蒸留（2026-08-12）。氏名・所在地等の事務項目は除外
validation:
  min_chars: 80
  want_numbers: true
checklist:
- 公式サイトのエントリーフォームの項目をひととおり確認した
- エントリー文を声に出して読んでみた
- 現経営者（親）に内容を話した ※申請は会社名・事業者名で行うため
- 送信は締切前日（11/24）までに行う予定を決めた
- エントリー後に届くフォーマットへの転記と、PDF提出（11/27 12:00）を予定に入れた
- 数字が3つ以上入っている（現状の規模・課題の大きさ・効果の見込みのどれか）
- 「革新的」「画期的」のような形容だけの言葉を、根拠なしに使っていない
- 応募資格（39歳以下・後継予定・家業の経営資源の活用）に自分が当てはまる根拠が本文から読み取れる
prompt_template: |
  あなたはインタビュアーです。私は中小企業の後継予定者（アトツギ）で、中小企業庁主催のピッチ大会「アトツギ甲子園」に出すエントリー文の中身を作っています。インタビューで私から材料を引き出してください。

  進め方:
  - 次の5つのテーマを順番に。質問は一度に1つだけ。
  - 各テーマの「押さえる要素」のうち、私の答えでまだ埋まっていないものだけを短く聞いてください。すでに埋まった要素を聞き直さないでください。
  - 答えが抽象的なときは、実際にあった出来事・固有名詞・数字を1つ引き出す追い質問をしてください。
  - 私が「わからない」「まだない」と答えた要素は、仮の書き方を1つ提案して先へ進んでください。尋問にしないでください。
  - 1テーマは3〜4往復まで。テンポよく進めてください。
  - 効果や未来の話が出たら、「誰に・どれくらい」の数字を1つだけ確かめてください（雇用・売上・件数など。無ければ仮置きでよい）。

  テーマと押さえる要素:
  {theme_elements}

  5テーマが終わったら、私の話した言葉をできるだけ活かして清書してください。形式は次のとおり（見出しは一字一句この通りに）:

  ## 現業と自分

  ## 現場で感じている課題

  ## やりたい新規事業

  ## 家業の経営資源の活用

  ## 実現したい未来

  各見出しの本文は250〜400字。数字と固有名詞を残す。私が話していない内容を足さない。誇張しない。
  では、最初の質問からお願いします。
pace:
  submit_target: '2026-11-24'
  buckets:
  - min_days: 90
    message: まだ十分間に合います。急ぎませんが、現経営者との対話だけは、早く始めるほど楽になります。
  - min_days: 45
    message: 間に合います。今月中にエントリー文の骨子まで進めておくと、後半に余裕ができます。
  - min_days: 21
    message: まだ間に合います。エントリー文はAIとのインタビューで1〜2日あれば形になります。今週始めれば余裕があります。
  - min_days: 7
    message: 今からでも間に合います。今日インタビューを始めれば、数日で骨子→読み合わせ→送信までいけます。
  - min_days: 1
    message: ぎりぎりですが、間に合います。今日中に骨子を作り、明日読み合わせて送信する日程です。
  - min_days: 0
    message: 本日が締切です。18:00までに公式サイトから送信を。
  closed_message: 第7回のエントリー受付は終了しました。書類提出が済んでいる方は11/27 12:00までの提出を。次の機会に向けた情報も引き続き掲載します。
