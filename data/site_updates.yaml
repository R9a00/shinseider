updates:
- date: '2026-11-13'
  text: 応募書類の文面をつくるAIへの指示文を、架空の会社で最後まで会話させる試験の結果で直しました。質問は15問までとし、公式6項目すべてに質問が入り、「新規事業に家業の何を使うか」「誰がいくら払うか」「最初の顧客と対価」「体制・資金・リスク」を必ず聞くようにしています。「30〜60分」という所要時間の表記は、確かめられていないため外しました。
- date: '2026-11-12'
  text: AIに渡す指示文に、中小企業診断士の視点（強みの根拠・収益の積算・実現可能性・リスク）と、主催者のねらい（戦略立案能力・発信力・実行力）からの点検を加えました。資格者による診断ではなく、AIによる準備支援です。道筋のページに、公的な相談窓口を載せました。
- date: '2026-11-12'
  text: 締切までの道筋を、先にエントリーを済ませて連休（11/21〜23）で応募書類をつくる順番に組み替えました。応募書類の出し直し・提出方法・プロフィール写真など、公式サイトと公式要項の記載を道筋のページにまとめています。
- date: '2026-10-30'
  text: 作成・点検の保存失敗表示、複数タブの控え、処理中の入力変更を改善しました。MCPの点検記録の上書き防止、空白を含むファイル名、Wordのタブ・改行の読込みも修正しました。
- date: '2026-10-30'
  text: 公式要項と経験者の知見を使う「応募書類の作成・点検」を追加しました。6項目の材料・出典・提出フォーマット・完成稿を保存し、普段のAIへ渡して調査、作成、引用付きの品質チェックを進められます。
- date: '2026-10-30'
  text: MCPで保存した下書きやレビュー本文を、次の会話で読み戻せるようにしました。架空の入力を使い、保存・再開・画面への取り込みを検証しました。
- date: '2026-10-30'
  text: 材料整理の5テーマから公式応募書類への使い方、提出形式、公式評価項目を明示しました。AIの予行審査とMCPの指示文を更新しました。
- date: '2026-10-29'
  text: 深掘りの計算例を訂正し、資格判定・締切直前の案内・データ取り込みを改善しました。補助金16次の受付期間、賃上げ条件の説明、会社サイトのリンクを修正しました。
- date: '2026-08-15'
  text: 出場歴を地方大会出場まで広げました（第3回〜第6回の地方名簿・計293名分の公式発表と全員を氏名で照合。これで名簿の全員に出場記録が付きました）。地図も実際の県境の形に変わりました。
- date: '2026-08-15'
  text: アンバサダー名簿に出場歴（第1〜6回の決勝大会の公式発表と照合）と各社サイトへのリンクを追加しました。同姓・似た氏名の方（棚元様ご兄弟、齊藤様/齋藤様）は運営者が本人確認のうえ区別して記載しています。
- date: '2026-08-14'
  text: 地域アンバサダーのページを新設しました（第7回・42名を地図と一覧から。第6回の歴代名簿もアーカイブ）。運営者と方針のページ、エントリー文の書き方の見本、予行審査の審査観点も追加しています。
- date: '2026-08-12'
  text: エントリーから書類提出までの公式の流れ（エントリー後に事務局からフォーマットが届き、PDFで提出）を公式サイトで確認し、エントリー文ページの説明を実際の流れに合わせました。
- date: '2026-08-06'
  text: 第7回アトツギ甲子園の日程・特典情報を公式発表に基づき掲載しました
- date: '2026-08-06'
  text: 事業承継・M&A補助金（事業承継促進枠）15次公募要領の内容を反映しました
