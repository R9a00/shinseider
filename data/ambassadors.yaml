  appointer: 中小企業庁（長官任命）
  role_note: 参加のきっかけは「他者からの紹介」が多いことから、過去ファイナリストを中心に任命。 魅力発信と、地域の後継者向けセミナー・トークセッション等を実施する。
  review_note: 氏名の異体字（濵/濱、齊/斎等）と第7回の鳥取・島根の所属はMETI別紙PDFでの照合が必要。 中国経産局ページとPRワイヤーで鳥取/島根の対応が逆になっており、 2025年名簿（中澤建設=島根）と整合するPRワイヤー側を採用した。
    【運営者確認 2026-08-15】棚元優太（アルミファクトリー・第4回準ファイナリスト）と棚元将太郎（大征工業・現任アンバサダー）は兄弟で別人（将太郎氏に決勝級の記録は付けない）。齊藤雄大（斎藤鐵工所・静岡）と齋藤孝曉（長後製パン・神奈川）は別人。
    岸田将志の会社は第6回任命リリースで「Kコーポレーション」だったが、第5回地方名簿・公式チラシPDFは「有限会社岸コーポレーション」で氏名・県一致のため後者を採用（抽出誤りと判断）。
  koshien_note: 出場歴は地方大会以上（地方大会出場・準ファイナリスト・決勝出場・受賞）。第3回45名・第4回68名・第5回90名・第6回90名の地方名簿、および第1〜6回の決勝関連発表と全員を氏名+会社で照合（県では絞らない。第1回・第2回に地方大会はない）。照合
    2026-08-15。この結果、名簿の66名全員に出場記録あり
  site_note: 会社サイトは検索と実地確認（社名・所在地・代表者の一致）を経たもののみ掲載。確認できなかった7社（滝本新作商店・武藤工芸鋳物・大森屋青果・マスヤ・川野真珠養殖・藤澤精麦工場・Kコーポレーション）は未掲載。一部は自社ドメインでないページ（Ownd/ペライチ等の自社公式ページ）。確認
    2026-08-15
  koshien_sources:
