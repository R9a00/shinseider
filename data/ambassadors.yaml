  blocks_note: '地域区分は大会の地方大会ブロック＝経済産業局管轄（関東=関東局11県で新潟・山梨・長野・静岡を含む、中部=中部局5県で三重を含む、近畿=近畿局で福井を含む）。根拠: 第6回関東ブロック決勝進出が山梨・静岡・東京でブロック賞名が関東経済産業局長賞（kyodonewsprwire.jp/release/202601263015、2026-08-15確認）'
