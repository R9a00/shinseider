  application_process:
    steps:
    - 会員登録のうえ、公式エントリーフォームに基本情報とエントリーにあたっての質問事項を入力（〜11/25 18:00）
    - エントリー完了後、事務局から応募書類のサンプルフォーマットがメールで届く
    - 応募書類をフォーマットで作成し、PDFに変換してメール提出。プロフィール写真も提出（〜11/27 12:00）
    notes:
    - 応募書類は受付期間内であれば出し直し可
    - 推薦エントリーの締切は11/20 12:00
    - 書類審査は提出した応募書類をもとに有識者が実施（公式FAQ）
    - エントリーフォーム内の設問文面は会員登録後のみ閲覧可能なため未確認（実エントリー時に確認する）
