    summary: 39歳以下（1987年4月以降生まれ）で代表権を持たない後継予定者
    details:
    - 親族外承継も対象
    - 家業と別法人の代表でも可（ただし家業承継予定か、家業の経営資源活用が必須）
    note: 公式文言は「後継予定者」。承継を決めていない人が出られるかは公式に明言がなく、
      サイト上で「継ぐと決める前でも出られる」とは書かないこと（2026-08-15にFAQまで確認して言い過ぎと判断、文言撤回）
