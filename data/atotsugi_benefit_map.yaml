conditions_and_notes:
- 各補助金の優遇を受けるには、アトツギ甲子園にエントリーした会社名又は事業者名での申請が必要（公式FAQ）
- 特典ページ（優遇＝地方大会出場者）と15次公募要領の加点条項（出場者=地方予選含む）で表現が異なる。適用境界は各公募回の要領原文が正であり、公募回ごとに再確認が必要
- 第7回出場者のステータス確定は書類審査通過時（推定2026年末〜2027年1月）。その後に申請受付が始まる公募回（事業承継・M&A補助金17次以降相当）で加点が使える見込み
