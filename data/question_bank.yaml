- id: q8_bm
  group: 新事業10問
  title: 8. ビジネスモデル
  subtitle: 収益構造とユニット経済
  dod: 設問に対し最小3行の具体（数値または固有名詞を1つ以上）
  min_required_fields: 2
  research: mixed
  sources_required: false
  entry_themes:
  - やりたい新規事業
  review_axes:
  - 事業価値
  fields:
  - key: formula
    label: 収益式と例
    required: true
    example: '収益モデルの例）

      売上 = 月間案件数 × 平均単価

      50件/月 × 8万円 = 400万円/月（4,800万円/年）


      利益 = 売上 - 原価 - 固定費

      原価率60%、固定費200万円/月の場合

      利益 = 400万円 - 240万円 - 200万円 = △40万円/月（受注拡大が必要）'
  - key: unit
    label: ユニット経済（ARPU・LTV・CAC）
    required: true
    example: '顧客単価の例）

      月次ARPU = 8万円 × 6件/年 ÷ 12ヶ月 = 4万円/月

      LTV = 4万円 × 継続年数3年 = 12万円/顧客

      CAC = 営業コスト月50万円 ÷ 新規獲得10社 = 5万円/顧客

      LTV/CAC = 12万円 ÷ 5万円 = 2.4（健全性あり）'
