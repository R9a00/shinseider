name: Site regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r site/requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --test site/tests/*.test.cjs
      - run: python -m unittest discover -s site/tests -p 'test_*.py'
      - run: python site/test_site.py
